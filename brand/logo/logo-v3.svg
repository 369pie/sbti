<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 620" width="512" height="620">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#161728"/>
      <stop offset="50%" stop-color="#0D0E1B"/>
      <stop offset="100%" stop-color="#080912"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B57A"/>
      <stop offset="50%" stop-color="#C9A86C"/>
      <stop offset="100%" stop-color="#C4939A"/>
    </linearGradient>
    <radialGradient id="mist" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#C4939A" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="gem" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="50%" stop-color="#D4B57A"/>
      <stop offset="100%" stop-color="#C4939A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0EBE3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#D4B57A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <rect width="512" height="620" fill="url(#bg)"/>
  <ellipse cx="256" cy="240" rx="110" ry="90" fill="url(#mist)"/>

  <!--
    CLEAN W: 3 peaks, straight-ish lines with slight organic softness

         L         R          ← left & right peaks (high)
          \       /
           \     /
            C                   ← center peak (medium height)
           / \
          /   \
         V1   V2               ← two valleys (low, equal)
    
    Eye sits at the bottom center, below C, between V1 and V2
  -->

  <!-- W: left peak → valley1 → center peak → valley2 → right peak -->
  <polyline points="150,175 205,320 256,200 307,320 362,175"
            fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"/>

  <!-- Subtle curve softening on the strokes -->
  <path d="M150,175 Q175,250 205,320" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M205,320 Q230,255 256,200" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M256,200 Q282,255 307,320" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
  <path d="M307,320 Q337,250 362,175" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>

  <!-- Thick accent strokes -->
  <polyline points="153,178 207,318" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.1"/>
  <polyline points="359,178 305,318" fill="none" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" opacity="0.1"/>

  <!-- Soft glow -->
  <ellipse cx="256" cy="255" rx="70" ry="55" fill="#D4B57A" opacity="0.02"/>

  <!--
    3 STAR NODES — one at each peak
  -->
  <!-- Left peak -->
  <circle cx="150" cy="175" r="4" fill="#D4B57A" opacity="0.9"/>
  <circle cx="150" cy="175" r="8" fill="url(#glow)"/>

  <!-- Center peak -->
  <circle cx="256" cy="200" r="3.5" fill="#D4B57A" opacity="0.85"/>
  <circle cx="256" cy="200" r="7" fill="url(#glow)"/>

  <!-- Right peak -->
  <circle cx="362" cy="175" r="4" fill="#D4B57A" opacity="0.9"/>
  <circle cx="362" cy="175" r="8" fill="url(#glow)"/>

  <!--
    THE EYE — below the W, in the open space at bottom center
  -->
  <path d="M230,340 Q243,318 256,314 Q269,318 282,340 Q269,360 256,364 Q243,360 230,340Z"
        fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.7"/>
  <path d="M240,340 Q249,326 256,323 Q263,326 272,340 Q263,352 256,355 Q249,352 240,340Z"
        fill="none" stroke="#D4B57A" stroke-width="0.5" opacity="0.3"/>
  <circle cx="256" cy="340" r="6" fill="url(#gem)" opacity="0.85"/>
  <circle cx="256" cy="340" r="3" fill="#F0EBE3" opacity="0.8"/>
  <circle cx="256" cy="340" r="1.2" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="251" cy="335" rx="1.5" ry="0.8" fill="#FFFFFF" opacity="0.2" transform="rotate(-10 251 335)"/>

  <!--
    SCATTERED STARS
  -->
  <circle cx="185" cy="120" r="1" fill="#F0EBE3" opacity="0.2"/>
  <circle cx="330" cy="115" r="1.2" fill="#F0EBE3" opacity="0.18"/>
  <circle cx="125" cy="240" r="0.8" fill="#D4B57A" opacity="0.15"/>
  <circle cx="390" cy="235" r="0.9" fill="#C4939A" opacity="0.12"/>
  <circle cx="215" cy="400" r="0.7" fill="#9B8EC4" opacity="0.1"/>
  <circle cx="300" cy="395" r="0.8" fill="#D4B57A" opacity="0.1"/>
  <circle cx="256" cy="105" r="0.6" fill="#F0EBE3" opacity="0.12"/>
  <circle cx="170" cy="145" r="0.5" fill="#F0EBE3" opacity="0.1"/>
  <circle cx="345" cy="140" r="0.5" fill="#F0EBE3" opacity="0.1"/>

  <!-- Sparkle -->
  <g transform="translate(205,135)" opacity="0.12">
    <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#F0EBE3" stroke-width="0.5"/>
    <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#F0EBE3" stroke-width="0.5"/>
  </g>
  <g transform="translate(310,130)" opacity="0.1">
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#D4B57A" stroke-width="0.4"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#D4B57A" stroke-width="0.4"/>
  </g>

  <!--
    TEXT
  -->
  <line x1="180" y1="410" x2="332" y2="410" stroke="#9B8EC4" stroke-width="0.4" opacity="0.18"/>

  <text x="256" y="468" text-anchor="middle"
        font-family="'Noto Serif SC', 'Source Han Serif SC', serif"
        font-size="36" font-weight="600" fill="#F0EBE3" letter-spacing="14" opacity="0.95">
    万相图鉴
  </text>

  <line x1="182" y1="483" x2="330" y2="483" stroke="#D4B57A" stroke-width="0.35" opacity="0.2"/>
  <circle cx="182" cy="483" r="1" fill="#C4939A" opacity="0.25"/>
  <circle cx="330" cy="483" r="1" fill="#C4939A" opacity="0.25"/>

  <text x="256" y="508" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Georgia', serif"
        font-size="11.5" fill="#D4B57A" letter-spacing="8" opacity="0.5">
    SOUL ATLAS
  </text>

  <circle cx="197" cy="505" r="1" fill="#C4939A" opacity="0.25"/>
  <circle cx="315" cy="505" r="1" fill="#C4939A" opacity="0.25"/>
</svg>
