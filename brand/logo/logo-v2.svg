<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 600" width="512" height="600">
  <defs>
    <!-- Deep night background -->
    <radialGradient id="nightBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161728"/>
      <stop offset="50%" stop-color="#0D0E1B"/>
      <stop offset="100%" stop-color="#080912"/>
    </radialGradient>
    
    <!-- Moonlight gold - warm, soft -->
    <linearGradient id="moonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B57A"/>
      <stop offset="30%" stop-color="#C9A86C"/>
      <stop offset="70%" stop-color="#C4939A"/>
      <stop offset="100%" stop-color="#D4B57A"/>
    </linearGradient>
    
    <!-- Rose mist glow -->
    <radialGradient id="roseMist" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#C4939A" stop-opacity="0.15"/>
      <stop offset="40%" stop-color="#9B8EC4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9B8EC4" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Lavender aura -->
    <radialGradient id="lavenderAura" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#9B8EC4" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#C4939A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Eye center gem -->
    <radialGradient id="eyeGem" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E8D5A8"/>
      <stop offset="30%" stop-color="#D4B57A"/>
      <stop offset="70%" stop-color="#C4939A"/>
      <stop offset="100%" stop-color="#9B8EC4"/>
    </radialGradient>
    
    <!-- Soft star glow -->
    <radialGradient id="softStar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0EBE3" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#D4B57A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4B57A" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Petal gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4B57A" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#C4939A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9B8EC4" stop-opacity="0.1"/>
    </linearGradient>
    
    <!-- Outer glow ring -->
    <radialGradient id="outerGlow" cx="50%" cy="42%" r="50%">
      <stop offset="70%" stop-color="#D4B57A" stop-opacity="0"/>
      <stop offset="85%" stop-color="#D4B57A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D4B57A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="600" fill="url(#nightBg)"/>
  
  <!-- Outer moonlight glow ring -->
  <circle cx="256" cy="250" r="210" fill="url(#outerGlow)"/>
  
  <!-- Lavender aura -->
  <ellipse cx="256" cy="245" rx="160" ry="150" fill="url(#lavenderAura)"/>
  
  <!-- Rose mist -->
  <ellipse cx="256" cy="240" rx="120" ry="115" fill="url(#roseMist)"/>
  
  <!-- === Outer petal/book-page shapes (organic curves) === -->
  <!-- These represent "图鉴" — the pages of the atlas -->
  
  <!-- Top petal -->
  <path d="M256,105 Q220,140 210,185 Q205,210 225,225 Q240,232 256,228 Q272,232 287,225 Q307,210 302,185 Q292,140 256,105Z" 
        fill="url(#petalGrad)" stroke="#D4B57A" stroke-width="0.6" stroke-opacity="0.3"/>
  
  <!-- Left petal -->
  <path d="M120,240 Q148,205 180,195 Q200,190 215,205 Q225,218 222,240 Q225,262 215,275 Q200,290 180,285 Q148,275 120,240Z"
        fill="url(#petalGrad)" stroke="#D4B57A" stroke-width="0.6" stroke-opacity="0.25" opacity="0.85"/>
  
  <!-- Right petal -->
  <path d="M392,240 Q364,205 332,195 Q312,190 297,205 Q287,218 290,240 Q287,262 297,275 Q312,290 332,285 Q364,275 392,240Z"
        fill="url(#petalGrad)" stroke="#D4B57A" stroke-width="0.6" stroke-opacity="0.25" opacity="0.85"/>
  
  <!-- Bottom-left petal -->
  <path d="M155,320 Q175,290 200,280 Q218,275 228,288 Q235,300 230,318 Q228,335 215,345 Q195,355 180,345 Q165,335 155,320Z"
        fill="url(#petalGrad)" stroke="#C4939A" stroke-width="0.5" stroke-opacity="0.2" opacity="0.7"/>
  
  <!-- Bottom-right petal -->
  <path d="M357,320 Q337,290 312,280 Q294,275 284,288 Q277,300 282,318 Q284,335 297,345 Q317,355 332,345 Q347,335 357,320Z"
        fill="url(#petalGrad)" stroke="#C4939A" stroke-width="0.5" stroke-opacity="0.2" opacity="0.7"/>
  
  <!-- Bottom petal (smaller) -->
  <path d="M256,380 Q235,355 228,335 Q225,320 235,312 Q245,308 256,312 Q267,308 277,312 Q287,320 284,335 Q277,355 256,380Z"
        fill="url(#petalGrad)" stroke="#9B8EC4" stroke-width="0.4" stroke-opacity="0.2" opacity="0.6"/>
  
  <!-- === The Eye — soul window === -->
  <!-- Soft, half-closed, contemplative eye shape -->
  
  <!-- Eye outer contour — soft almond shape using bezier curves -->
  <path d="M200,240 Q228,200 256,195 Q284,200 312,240 Q284,278 256,283 Q228,278 200,240Z"
        fill="none" stroke="url(#moonGold)" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Eye inner contour -->
  <path d="M215,240 Q235,212 256,208 Q277,212 297,240 Q277,266 256,270 Q235,266 215,240Z"
        fill="none" stroke="#D4B57A" stroke-width="0.8" opacity="0.45"/>
  
  <!-- Iris — the "soul" center -->
  <ellipse cx="256" cy="240" rx="28" ry="32" fill="none" stroke="#C4939A" stroke-width="0.6" opacity="0.35"/>
  
  <!-- Pupil facets (soft, like a gem) -->
  <path d="M256,218 L240,235 L248,255 L264,255 L272,235Z" 
        fill="none" stroke="#D4B57A" stroke-width="0.4" opacity="0.25"/>
  <line x1="256" y1="218" x2="256" y2="270" stroke="#D4B57A" stroke-width="0.3" opacity="0.2"/>
  <line x1="235" y1="240" x2="277" y2="240" stroke="#D4B57A" stroke-width="0.3" opacity="0.2"/>
  
  <!-- Center gem / star -->
  <circle cx="256" cy="240" r="8" fill="url(#eyeGem)" opacity="0.9"/>
  <circle cx="256" cy="240" r="4" fill="#F0EBE3" opacity="0.85"/>
  <circle cx="256" cy="240" r="1.5" fill="#FFFFFF" opacity="0.95"/>
  
  <!-- Eye highlight (like light reflecting in an eye) -->
  <ellipse cx="248" cy="232" rx="3" ry="2" fill="#FFFFFF" opacity="0.25" transform="rotate(-15 248 232)"/>
  
  <!-- === Scattered star dust === -->
  <!-- Delicate, organic placement — NOT a grid -->
  
  <!-- Near the eye -->
  <circle cx="195" cy="210" r="1.2" fill="#F0EBE3" opacity="0.4"/>
  <circle cx="318" cy="215" r="1" fill="#F0EBE3" opacity="0.35"/>
  <circle cx="180" cy="260" r="0.8" fill="#D4B57A" opacity="0.3"/>
  <circle cx="335" cy="255" r="0.9" fill="#D4B57A" opacity="0.3"/>
  
  <!-- Among the petals -->
  <circle cx="230" cy="145" r="1.5" fill="#F0EBE3" opacity="0.35"/>
  <circle cx="280" cy="150" r="1.2" fill="#C4939A" opacity="0.3"/>
  <circle cx="160" cy="220" r="1" fill="#9B8EC4" opacity="0.25"/>
  <circle cx="350" cy="230" r="1.3" fill="#D4B57A" opacity="0.28"/>
  <circle cx="175" cy="290" r="0.9" fill="#F0EBE3" opacity="0.2"/>
  <circle cx="340" cy="300" r="1.1" fill="#C4939A" opacity="0.22"/>
  <circle cx="240" cy="340" r="0.8" fill="#9B8EC4" opacity="0.2"/>
  <circle cx="275" cy="345" r="1" fill="#D4B57A" opacity="0.25"/>
  
  <!-- Distant stars -->
  <circle cx="130" cy="140" r="0.8" fill="#F0EBE3" opacity="0.15"/>
  <circle cx="380" cy="130" r="0.6" fill="#F0EBE3" opacity="0.12"/>
  <circle cx="110" cy="310" r="0.7" fill="#D4B57A" opacity="0.1"/>
  <circle cx="400" cy="320" r="0.9" fill="#9B8EC4" opacity="0.12"/>
  <circle cx="200" cy="400" r="0.6" fill="#C4939A" opacity="0.1"/>
  <circle cx="320" cy="395" r="0.7" fill="#F0EBE3" opacity="0.12"/>
  <circle cx="155" cy="170" r="0.5" fill="#F0EBE3" opacity="0.1"/>
  <circle cx="365" cy="175" r="0.5" fill="#F0EBE3" opacity="0.1"/>
  
  <!-- Tiny sparkle crosses (4-point stars) -->
  <g transform="translate(220,130)" opacity="0.2">
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#F0EBE3" stroke-width="0.5"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#F0EBE3" stroke-width="0.5"/>
  </g>
  <g transform="translate(340,155)" opacity="0.18">
    <line x1="-2.5" y1="0" x2="2.5" y2="0" stroke="#D4B57A" stroke-width="0.5"/>
    <line x1="0" y1="-2.5" x2="0" y2="2.5" stroke="#D4B57A" stroke-width="0.5"/>
  </g>
  <g transform="translate(170,340)" opacity="0.15">
    <line x1="-2" y1="0" x2="2" y2="0" stroke="#9B8EC4" stroke-width="0.4"/>
    <line x1="0" y1="-2" x2="0" y2="2" stroke="#9B8EC4" stroke-width="0.4"/>
  </g>
  
  <!-- === Brand Text === -->
  
  <!-- Chinese brand name — elegant serif -->
  <text x="256" y="468" text-anchor="middle" 
        font-family="'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', 'SimSun', serif" 
        font-size="38" font-weight="600" fill="#F0EBE3" letter-spacing="14" opacity="0.95">
    万相图鉴
  </text>
  
  <!-- Subtle underline accent -->
  <line x1="175" y1="482" x2="337" y2="482" stroke="#D4B57A" stroke-width="0.4" opacity="0.25"/>
  <circle cx="175" cy="482" r="1" fill="#C4939A" opacity="0.3"/>
  <circle cx="337" cy="482" r="1" fill="#C4939A" opacity="0.3"/>
  <circle cx="256" cy="482" r="0.7" fill="#9B8EC4" opacity="0.35"/>
  
  <!-- English subtitle — thin elegant sans -->
  <text x="256" y="508" text-anchor="middle" 
        font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" 
        font-size="12" fill="#D4B57A" letter-spacing="8" opacity="0.55">
    SOUL ATLAS
  </text>
  
  <!-- Decorative dots flanking subtitle -->
  <circle cx="188" cy="505" r="1.2" fill="#C4939A" opacity="0.3"/>
  <circle cx="324" cy="505" r="1.2" fill="#C4939A" opacity="0.3"/>
</svg>
