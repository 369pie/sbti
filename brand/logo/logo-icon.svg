<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1A1B2E"/>
      <stop offset="100%" stop-color="#0A0B14"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A86C"/>
      <stop offset="50%" stop-color="#D4B87A"/>
      <stop offset="100%" stop-color="#B8868C"/>
    </linearGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B8868C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#B8868C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gemGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#D4B87A"/>
      <stop offset="40%" stop-color="#C9A86C"/>
      <stop offset="100%" stop-color="#B8868C"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F3EFE6" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#C9A86C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C9A86C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lavenderLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B8EC4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B8868C" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#bgGlow)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#C9A86C" stroke-opacity="0.06" stroke-width="1"/>
  
  <!-- Rose glow -->
  <ellipse cx="256" cy="250" rx="150" ry="130" fill="url(#roseGlow)"/>
  
  <!-- Constellation - scaled up and centered for icon -->
  <!-- Top arc -->
  <line x1="138" y1="220" x2="205" y2="160" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="205" y1="160" x2="256" y2="140" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="256" y1="140" x2="307" y2="160" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="307" y1="160" x2="374" y2="220" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  
  <!-- Bottom arc -->
  <line x1="138" y1="220" x2="195" y2="310" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="195" y1="310" x2="256" y2="345" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="256" y1="345" x2="317" y2="310" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="317" y1="310" x2="374" y2="220" stroke="url(#goldLine)" stroke-width="1.5" stroke-opacity="0.7"/>
  
  <!-- Cross lines -->
  <line x1="138" y1="220" x2="374" y2="220" stroke="url(#lavenderLine)" stroke-width="0.8" stroke-opacity="0.35"/>
  <line x1="195" y1="310" x2="317" y2="310" stroke="url(#lavenderLine)" stroke-width="0.8" stroke-opacity="0.35"/>
  
  <!-- Diagonal connections -->
  <line x1="205" y1="160" x2="195" y2="310" stroke="url(#lavenderLine)" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="307" y1="160" x2="317" y2="310" stroke="url(#lavenderLine)" stroke-width="0.6" stroke-opacity="0.25"/>
  <line x1="256" y1="140" x2="256" y2="345" stroke="url(#lavenderLine)" stroke-width="0.6" stroke-opacity="0.2"/>
  
  <!-- 7 universe nodes -->
  <circle cx="256" cy="140" r="5" fill="#C9A86C"/>
  <circle cx="256" cy="140" r="10" fill="url(#starGlow)"/>
  <circle cx="205" cy="160" r="4" fill="#C9A86C" opacity="0.9"/>
  <circle cx="205" cy="160" r="7" fill="url(#starGlow)"/>
  <circle cx="307" cy="160" r="4" fill="#C9A86C" opacity="0.9"/>
  <circle cx="307" cy="160" r="7" fill="url(#starGlow)"/>
  <circle cx="138" cy="220" r="4" fill="#B8868C" opacity="0.9"/>
  <circle cx="138" cy="220" r="7" fill="url(#starGlow)"/>
  <circle cx="374" cy="220" r="4" fill="#B8868C" opacity="0.9"/>
  <circle cx="374" cy="220" r="7" fill="url(#starGlow)"/>
  <circle cx="195" cy="310" r="3.5" fill="#9B8EC4" opacity="0.8"/>
  <circle cx="195" cy="310" r="6" fill="url(#starGlow)"/>
  <circle cx="317" cy="310" r="3.5" fill="#9B8EC4" opacity="0.8"/>
  <circle cx="317" cy="310" r="6" fill="url(#starGlow)"/>
  <circle cx="256" cy="345" r="3" fill="#C9A86C" opacity="0.7"/>
  <circle cx="256" cy="345" r="5" fill="url(#starGlow)"/>
  
  <!-- Center eye/gem -->
  <ellipse cx="256" cy="240" rx="32" ry="40" fill="none" stroke="url(#goldLine)" stroke-width="1.8" opacity="0.9"/>
  <ellipse cx="256" cy="240" rx="20" ry="28" fill="none" stroke="#C9A86C" stroke-width="0.8" opacity="0.45"/>
  
  <!-- Gem facets -->
  <line x1="256" y1="212" x2="236" y2="240" stroke="#C9A86C" stroke-width="0.6" opacity="0.35"/>
  <line x1="256" y1="212" x2="276" y2="240" stroke="#C9A86C" stroke-width="0.6" opacity="0.35"/>
  <line x1="236" y1="240" x2="256" y2="268" stroke="#C9A86C" stroke-width="0.6" opacity="0.35"/>
  <line x1="276" y1="240" x2="256" y2="268" stroke="#C9A86C" stroke-width="0.6" opacity="0.35"/>
  
  <!-- Center gem dot -->
  <circle cx="256" cy="240" r="5" fill="url(#gemGlow)"/>
  <circle cx="256" cy="240" r="2.5" fill="#F3EFE6" opacity="0.9"/>
  
  <!-- Scattered micro-stars -->
  <circle cx="170" cy="110" r="1.2" fill="#F3EFE6" opacity="0.25"/>
  <circle cx="350" cy="100" r="1.4" fill="#F3EFE6" opacity="0.2"/>
  <circle cx="110" cy="280" r="1" fill="#C9A86C" opacity="0.25"/>
  <circle cx="400" cy="290" r="1.2" fill="#B8868C" opacity="0.2"/>
  <circle cx="210" cy="380" r="1" fill="#9B8EC4" opacity="0.25"/>
  <circle cx="310" cy="370" r="1.2" fill="#C9A86C" opacity="0.18"/>
  <circle cx="155" cy="175" r="0.7" fill="#F3EFE6" opacity="0.15"/>
  <circle cx="360" cy="180" r="0.7" fill="#F3EFE6" opacity="0.15"/>
</svg>
